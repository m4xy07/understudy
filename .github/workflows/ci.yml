name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets and no live model. The keys are dummy test values. MODEL_NAME and MODEL_BASE_URL only
# form the cache tag, so the seeded answers in data/demo/model_cache.json are found.
env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/understudy
  IDENTITY_KEY: ci-identity-key-not-a-secret
  CONTACTS_KEY: ci-contacts-key-not-a-secret
  MODEL_DISABLED: "1"
  MODEL_NAME: qwen/qwen3-32b
  MODEL_BASE_URL: https://openrouter.ai/api/v1

jobs:
  test:
    name: test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres: &postgres
        image: postgres:16
        env:
          POSTGRES_DB: understudy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d understudy"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e (local server, model disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - name: Start the app and wait for it
        run: |
          pnpm start &
          curl --silent --fail --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://localhost:3000
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
