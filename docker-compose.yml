services:
  db:
    image: postgres:16
    container_name: understudy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: understudy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "45432:5432"
    volumes:
      - understudy-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d understudy"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  understudy-pg:
